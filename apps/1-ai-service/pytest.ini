[pytest]
# Tìm kiếm các file test có tiền tố 'test_'
python_files = test_*.py
# Tìm kiếm các class có tiền tố 'Test'
python_classes = Test*
# Tìm kiếm các function test có tiền tố 'test_'
python_functions = test_*

# Bật cờ asyncio cho các test bất đồng bộ
asyncio_mode = auto

# Bỏ qua các thư mục không liên quan
norecursedirs = .git .tox venv .venv env build dist

# Hiển thị thêm thông tin chi tiết
# verbose = true  # Đã xóa vì gây warning

# Hiển thị thời gian chạy các test 
# durations = 5  # Đã xóa vì gây warning

# Markers
markers =
    unit: mark a test as a unit test
    integration: mark a test as an integration test
    e2e: mark a test as an end-to-end test
    api: mark a test as an API test
    slow: mark a test as slow-running